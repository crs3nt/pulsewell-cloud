{% extends "layout.html" %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-6">
    <div class="card border-0 shadow-sm p-4">
      <h4 class="fw-bold mb-3">Create Pulse Survey</h4>
      <form method="POST">
        <div class="mb-3">
          <label class="form-label fw-semibold">Survey Title</label>
          <input type="text" name="title" class="form-control" placeholder="e.g. Q4 Culture & Workload Check" required>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Instructions for Employees</label>
          <textarea name="description" class="form-control" rows="3" placeholder="Explain the survey goal to your staff..."></textarea>
        </div>
        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-primary flex-grow-1">Publish Survey</button>
          <a href="/dashboard" class="btn btn-outline-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
