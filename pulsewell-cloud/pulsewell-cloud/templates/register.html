{% extends "layout.html" %}
{% block content %}
<div class="row justify-content-center pt-3">
  <div class="col-12 col-md-5">
    <div class="card shadow-sm border-0 p-4">
      <h3 class="fw-bold mb-3 text-center">Create HR Account</h3>
      <form method="POST">
        <div class="mb-3">
          <label class="form-label fw-semibold">Company / Org Name</label>
          <input type="text" name="org_name" class="form-control" placeholder="e.g. Acme Corp" required>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">HR Work Email</label>
          <input type="email" name="email" class="form-control" placeholder="hr@company.com" required>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Password</label>
          <input type="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-success w-100 py-2 fw-semibold">Register Portal</button>
      </form>
      <p class="text-center text-muted small mt-3 mb-0">Already registered? <a href="/login">Login</a></p>
    </div>
  </div>
</div>
{% endblock %}
